<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="page-title">Editar Receta – Robles Gastro Lab</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
  <div id="navbar-root"></div>

  <main class="container py-4">
    <div class="card p-3 shadow">
      <h3 id="form-title">Editar receta</h3>

      <form id="receta-form" class="row g-3">

        <div class="col-md-6">
          <label class="form-label">Título</label>
          <input name="titulo" class="form-control" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Tipo</label>
          <select name="tipo" class="form-select" required>
            <option value="desayuno">Desayuno</option>
            <option value="almuerzo">Almuerzo</option>
            <option value="cena">Cena</option>
            <option value="postre">Postre</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Dificultad</label>
          <select name="dificultad" class="form-select" required>
            <option value="Fácil">Fácil</option>
            <option value="Media">Media</option>
            <option value="Difícil">Difícil</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Duración (min)</label>
          <input type="number" name="duracion" class="form-control" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Presupuesto por porción</label>
          <input type="number" step="0.01" name="presupuestoPorPorcion" class="form-control" required>
        </div>

        <div class="col-12">
          <label class="form-label">Descripción</label>
          <textarea name="descripcion" class="form-control" rows="3"></textarea>
        </div>

        <!-- IMÁGENES -->
        <div class="col-12">
          <label class="form-label">Imágenes (URLs)</label>
          <div id="imagenes-list" class="d-flex gap-2">
            <input name="imagen-0" class="form-control" placeholder="URL 1">
            <input name="imagen-1" class="form-control" placeholder="URL 2">
            <input name="imagen-2" class="form-control" placeholder="URL 3">
          </div>
        </div>

        <!-- INGREDIENTES -->
        <div class="col-12">
          <label class="form-label">Ingredientes</label>
          <div id="ingredientes-root" class="mb-2"></div>
          <button id="add-ingrediente" type="button" class="btn btn-sm btn-outline-primary">+ Añadir ingrediente</button>
        </div>

        <!-- PASOS -->
        <div class="col-12">
          <label class="form-label">Pasos</label>
          <div id="pasos-root" class="mb-2"></div>
          <button id="add-paso" type="button" class="btn btn-sm btn-outline-secondary">+ Añadir paso</button>
        </div>

        <div class="col-12 text-end">
          <button class="btn btn-success" id="submit-btn">Guardar cambios</button>
        </div>
      </form>
    </div>
  </main>

  <div id="footer-root"></div>

  <script src="/components/navbar.js"></script>
  <script src="/components/footer.js"></script>

  <script src="/services/recetasService.js"></script>
  <script src="/services/http.js"></script>

  <script>
    const token = localStorage.getItem("token");
    if (!token) {
      alert("Debes iniciar sesión.");
      window.location.href = "/pages/login.html";
    }

    const params = new URLSearchParams(window.location.search);
    const recetaId = params.get("id");

    const form = document.getElementById("receta-form");
    const ingredientesRoot = document.getElementById("ingredientes-root");
    const pasosRoot = document.getElementById("pasos-root");

    // Helpers dinámicos
    function addIngrediente({ nombre = "", cantidad = "", costo = "" } = {}) {
      const wrapper = document.createElement("div");
      wrapper.className = "d-flex gap-2 mb-2";
      wrapper.innerHTML = `
        <input class="form-control" placeholder="Nombre" data-role="ing-nombre" value="${nombre}">
        <input class="form-control" placeholder="Cantidad" data-role="ing-cantidad" value="${cantidad}">
        <input class="form-control" placeholder="Costo" type="number" step="0.01" data-role="ing-costo" value="${costo}">
        <button type="button" class="btn btn-outline-danger btn-sm">x</button>
      `;
      wrapper.querySelector("button").onclick = () => wrapper.remove();
      ingredientesRoot.appendChild(wrapper);
    }

    function addPaso(text = "") {
      const wrapper = document.createElement("div");
      wrapper.className = "d-flex gap-2 mb-2";
      wrapper.innerHTML = `
        <textarea class="form-control" rows="1">${text}</textarea>
        <button type="button" class="btn btn-outline-danger btn-sm">x</button>
      `;
      wrapper.querySelector("button").onclick = () => wrapper.remove();
      pasosRoot.appendChild(wrapper);
    }

    // Si es EDITAR → cargar datos
    async function loadReceta() {
      if (!recetaId) return;

      const receta = await recetasService.getById(recetaId);

      document.getElementById("form-title").innerText = "Editar receta";
      document.getElementById("page-title").innerText = "Editar receta";
      document.getElementById("submit-btn").innerText = "Guardar cambios";

      form.titulo.value = receta.titulo;
      form.tipo.value = receta.tipo;
      form.dificultad.value = receta.dificultad;
      form.duracion.value = receta.duracion;
      form.presupuestoPorPorcion.value = receta.presupuestoPorPorcion;
      form.descripcion.value = receta.descripcion;

      // Imágenes
      (receta.imagenes || []).forEach((img, i) => {
        const input = form[`imagen-${i}`];
        if (input) input.value = img;
      });

      // Ingredientes
      ingredientesRoot.innerHTML = "";
      receta.ingredientes.forEach(i => addIngrediente(i));

      // Pasos
      pasosRoot.innerHTML = "";
      receta.pasos.forEach(p => addPaso(p));

    }

    loadReceta();

    // BOTÓN AÑADIR INGRE/PASO
    document.getElementById("add-ingrediente").onclick = () => addIngrediente();
    document.getElementById("add-paso").onclick = () => addPaso();

    // SUBMIT
    form.addEventListener("submit", async e => {
      e.preventDefault();

      // payload general
      const payload = {
        titulo: form.titulo.value.trim(),
        descripcion: form.descripcion.value.trim(),
        tipo: form.tipo.value,
        dificultad: form.dificultad.value,
        duracion: Number(form.duracion.value),
        presupuestoPorPorcion: Number(form.presupuestoPorPorcion.value),
        imagenes: [],
        ingredientes: [],
        pasos: []
      };

      // imágenes
      for (let i=0; i<3; i++) {
        const v = form[`imagen-${i}`].value.trim();
        if (v) payload.imagenes.push(v);
      }

      // ingredientes
      payload.ingredientes = Array.from(ingredientesRoot.children).map(w => ({
        nombre: w.querySelector("[data-role=ing-nombre]").value.trim(),
        cantidad: w.querySelector("[data-role=ing-cantidad]").value.trim(),
        costo: Number(w.querySelector("[data-role=ing-costo]").value)
      })).filter(i => i.nombre);

      // pasos
      payload.pasos = Array.from(pasosRoot.children)
        .map(w => w.querySelector("textarea").value.trim())
        .filter(p => p);

      try {
        let res;

        if (recetaId) {
          // EDITAR
          res = await recetasService.update(token, recetaId, payload);
          alert("Receta actualizada");
          window.location.href = `/pages/receta-view.html?id=${recetaId}`;
        } else {
          // CREAR (fallback)
          res = await recetasService.create(token, payload);
          alert("Receta creada");
          window.location.href = `/pages/receta-view.html?id=${res.receta._id}`;
        }

      } catch (err) {
        console.error(err);
        alert("Error guardando receta");
      }
    });
  </script>

</body>
</html>
