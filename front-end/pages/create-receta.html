<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear Receta – Robles Gastro Lab</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="navbar-root"></div>

  <main class="container py-4">
    <div class="card p-3 shadow">
      <h3>Crear nueva receta</h3>
      <form id="receta-form" class="row g-3">

        <div class="col-md-6">
          <label class="form-label">Título</label>
          <input name="titulo" class="form-control" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Tipo</label>
          <select name="tipo" class="form-select" required>
            <option value="desayuno">Desayuno</option>
            <option value="almuerzo">Almuerzo</option>
            <option value="cena">Cena</option>
            <option value="postre">Postre</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Dificultad</label>
          <select name="dificultad" class="form-select" required>
            <option value="Fácil">Fácil</option>
            <option value="Media">Media</option>
            <option value="Difícil">Difícil</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Duración (min)</label>
          <input type="number" name="duracion" class="form-control" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Presupuesto por porción</label>
          <input type="number" step="0.01" name="presupuestoPorPorcion" class="form-control" required>
        </div>

        <div class="col-12">
          <label class="form-label">Descripción</label>
          <textarea name="descripcion" class="form-control" rows="3"></textarea>
        </div>

        <!-- IMÁGENES -> URLs -->
        <div class="col-12">
          <label class="form-label">Imágenes (URLs) — hasta 3</label>
          <div id="imagenes-list" class="d-flex gap-2">
            <input name="imagen-0" class="form-control" placeholder="URL imagen 1">
            <input name="imagen-1" class="form-control" placeholder="URL imagen 2">
            <input name="imagen-2" class="form-control" placeholder="URL imagen 3">
          </div>
        </div>

        <!-- INGREDIENTES DINÁMICOS -->
        <div class="col-12">
          <label class="form-label">Ingredientes</label>
          <div id="ingredientes-root" class="mb-2"></div>
          <button id="add-ingrediente" type="button" class="btn btn-sm btn-outline-primary">+ Añadir ingrediente</button>
        </div>

        <!-- PASOS DINÁMICOS -->
        <div class="col-12">
          <label class="form-label">Pasos</label>
          <div id="pasos-root" class="mb-2"></div>
          <button id="add-paso" type="button" class="btn btn-sm btn-outline-secondary">+ Añadir paso</button>
        </div>

        <div class="col-12 text-end">
          <button class="btn btn-success">Crear receta</button>
        </div>
      </form>
    </div>
  </main>

  <div id="footer-root"></div>

  <script src="/components/navbar.js"></script>
  <script src="/components/footer.js"></script>

  <script src="/services/recetasService.js"></script>

  <script>
    const token = localStorage.getItem("token");
    if (!token) {
      alert("Debes iniciar sesión para crear recetas.");
      window.location.href = "/pages/login.html";
    }

    // Helpers para crear inputs dinámicos
    const ingredientesRoot = document.getElementById('ingredientes-root');
    const pasosRoot = document.getElementById('pasos-root');

    function addIngrediente({ nombre = '', cantidad = '', costo = '' } = {}) {
      const idx = Date.now() + Math.random();
      const wrapper = document.createElement('div');
      wrapper.className = 'd-flex gap-2 mb-2';
      wrapper.innerHTML = `
        <input class="form-control" placeholder="Nombre" data-role="ing-nombre" value="${nombre}">
        <input class="form-control" placeholder="Cantidad" data-role="ing-cantidad" value="${cantidad}">
        <input class="form-control" placeholder="Costo" type="number" min="0" step="0.01" data-role="ing-costo" value="${costo}">
        <button type="button" class="btn btn-outline-danger btn-sm" data-action="remove">x</button>
      `;
      wrapper.querySelector('[data-action="remove"]').addEventListener('click', () => wrapper.remove());
      ingredientesRoot.appendChild(wrapper);
    }

    function addPaso(text = '') {
      const wrapper = document.createElement('div');
      wrapper.className = 'd-flex gap-2 mb-2';
      wrapper.innerHTML = `
        <textarea class="form-control" rows="1" placeholder="Descripción del paso">${text}</textarea>
        <button type="button" class="btn btn-outline-danger btn-sm">x</button>
      `;
      wrapper.querySelector('button').addEventListener('click', () => wrapper.remove());
      pasosRoot.appendChild(wrapper);
    }

    // inicial
    addIngrediente();
    addPaso();

    document.getElementById('add-ingrediente').addEventListener('click', () => addIngrediente());
    document.getElementById('add-paso').addEventListener('click', () => addPaso());

    // submit
    document.getElementById('receta-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;

      const titulo = form.titulo.value.trim();
      const descripcion = form.descripcion.value.trim();
      const tipo = form.tipo.value;
      const dificultad = form.dificultad.value;
      const duracion = Number(form.duracion.value);
      const presupuestoPorPorcion = Number(form.presupuestoPorPorcion.value);

      // imágenes
      const imagenes = [];
      for (let i=0;i<3;i++){
        const val = form[`imagen-${i}`].value.trim();
        if (val) imagenes.push(val);
      }

      // ingredientes
      const ingredientes = Array.from(ingredientesRoot.children).map(w => {
        const nombre = w.querySelector('[data-role="ing-nombre"]').value.trim();
        const cantidad = w.querySelector('[data-role="ing-cantidad"]').value.trim();
        const costo = Number(w.querySelector('[data-role="ing-costo"]').value) || 0;
        return { nombre, cantidad, costo };
      }).filter(i => i.nombre);

      // pasos
      const pasos = Array.from(pasosRoot.children).map(w => {
        const texto = w.querySelector('textarea').value.trim();
        return { paso: texto };
      }).filter(p => p.paso);

      const payload = {
        titulo, descripcion, tipo, dificultad, duracion, presupuestoPorPorcion,
        imagenes, ingredientes, pasos
      };

      try {
        const res = await recetasService.create(token, payload);
        if (res && res.receta) {
          alert('Receta creada');
          window.location.href = `/pages/receta-view.html?id=${res.receta._id}`;
        } else {
          alert('Error al crear la receta');
          console.error(res);
        }
      } catch (err) {
        console.error(err);
        alert('Ocurrió un error creando la receta');
      }
    });
  </script>
</body>
</html>
