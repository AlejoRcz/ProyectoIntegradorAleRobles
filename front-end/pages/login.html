<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión – Robles Gastro Lab</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="bg-light">
<div id="navbar-root"></div>

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4 shadow">
        
        <h1 class="h4 mb-4 text-center">Iniciar sesión</h1>

        <form id="login-form" class="needs-validation">
          <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" name="email" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" required>
          </div>

          <button class="btn btn-primary w-100" type="submit">Ingresar</button>

          <p class="mt-3 small text-center">
            ¿No tienes cuenta? <a href="/pages/register.html">Regístrate aquí</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</main>

<div id="footer-root"></div>

<script src="/components/navbar.js"></script>
<script src="/components/footer.js"></script>

<script src="/services/http.js"></script>
<script src="/services/authService.js"></script>
<script src="/pages/login.js"></script>

<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const fd = new FormData(e.target);
  const identifier = fd.get("email");
  const password = fd.get("password");

  const res = await authService.login(identifier, password);

  if (!res || !res.token) {
    alert("Credenciales incorrectas");
    return;
  }

  localStorage.setItem("token", res.token);
  localStorage.setItem("user", JSON.stringify(res.user));

  window.location.href = "/index.html";
});
</script>

</body>
</html>
