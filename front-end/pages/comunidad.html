<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comunidad – Robles Gastro Lab</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
  <div id="navbar-root"></div>

  <main class="container py-4">
    <h1 class="mb-4">Comunidad</h1>

    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card p-3 shadow">
          <h5>Recetas más populares</h5>
          <ul id="rank-pop" class="list-group mt-2"></ul>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card p-3 shadow">
          <h5>Mejor valoradas</h5>
          <ul id="rank-val" class="list-group mt-2"></ul>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card p-3 shadow">
          <h5>Top Usuarios</h5>
          <ul id="rank-users" class="list-group mt-2"></ul>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card p-3 shadow">
          <h5>Top Cocineros</h5>
          <ul id="rank-chefs" class="list-group mt-2"></ul>
        </div>
      </div>
    </div>

    <div class="card p-3 shadow mt-4">
      <h4>Eventos activos</h4>
      <div id="eventos" class="mt-3"></div>
    </div>

    <div class="text-center mt-3">
      <!-- Botón que abre el modal del chat -->
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#chatModal">
        <i class="bi bi-chat-dots me-1"></i> Entrar al chat de la comunidad
      </button>
    </div>
  </main>

  <div id="footer-root"></div>

  <!-- CHAT MODAL -->
  <div class="modal fade" id="chatModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Chat de la comunidad</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="chat-box" class="border rounded p-3" style="height: 50vh; overflow-y: auto;">
            <div class="text-muted">Cargando mensajes…</div>
          </div>

          <form id="chat-form" class="d-flex mt-3">
            <input id="chat-input" class="form-control me-2" placeholder="Escribe un mensaje…" />
            <button class="btn btn-primary">Enviar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- componentes y servicios -->
  <script src="/components/navbar.js"></script>
  <script src="/components/footer.js"></script>

  <script src="/services/http.js"></script>
  <script src="/services/comunidadService.js"></script>
  <script src="/services/eventoService.js"></script>
  <script src="/services/recetasService.js"></script>
  <script src="/services/chatService.js"></script>

  <script>
    // Rankings y eventos
    async function loadRankings() {
      const pop = await comunidadService.rankingPopularidad();
      document.getElementById("rank-pop").innerHTML = (pop || []).map(r => `
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <a href="/pages/receta-view.html?id=${r._id}" class="stretched-link text-decoration-none">${r.titulo}</a>
          <span class="badge bg-secondary rounded-pill">${r.calificaciones?.length || 0}</span>
        </li>
      `).join('') || '<li class="list-group-item text-muted">No hay datos.</li>';

      const val = await comunidadService.rankingValoracion();
      document.getElementById("rank-val").innerHTML = (val || []).map(r => `
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <a href="/pages/receta-view.html?id=${r._id}" class="text-decoration-none">${r.titulo}</a>
          <span>${(r.promedio||0).toFixed(1)} ★</span>
        </li>
      `).join('') || '<li class="list-group-item text-muted">No hay datos.</li>';

      const users = await comunidadService.rankingUsuarios();
      document.getElementById("rank-users").innerHTML = (users || []).map(u => `
        <li class="list-group-item d-flex justify-content-between">
          <a href="/pages/profile.html?id=${u._id}" class="text-decoration-none">@${u.username}</a>
          <span>${u.followersCount || 0} seguidores</span>
        </li>
      `).join('') || '<li class="list-group-item text-muted">No hay datos.</li>';

      const chefs = await comunidadService.rankingCocineros();
      document.getElementById("rank-chefs").innerHTML = (chefs || []).map(c => `
        <li class="list-group-item d-flex justify-content-between">
          <a href="/pages/profile.html?id=${c._id._id}" class="text-decoration-none">
            @${c._id.username}
          </a>
          <span>${c.total || 0} recetas</span>
        </li>
      `).join('') || '<li class="list-group-item text-muted">No hay datos.</li>';
    }

    async function loadEventos() {
      // EventoService diseñado para llamar a /api/comunidad/eventos
      const eventos = await eventoService.getActive();
      const cont = document.getElementById("eventos");
      if (!eventos || eventos.length === 0) {
        cont.innerHTML = '<p class="text-muted">No hay eventos activos.</p>';
        return;
      }
      cont.innerHTML = eventos.map(ev => `
        <div class="border rounded p-3 mb-2">
          <h6 class="mb-1">${ev.titulo}</h6>
          <p class="small mb-0">${ev.descripcion}</p>
          <div class="small text-muted mt-1">${ev.mes}/${ev.ano}</div>
        </div>
      `).join('');
    }

    // Chat modal logic
    const token = localStorage.getItem('token');

    async function loadChat() {
      const box = document.getElementById('chat-box');
      if (!box) return;
      try {
        const mensajes = await chatService.getMessages(token);
        box.innerHTML = (mensajes || []).map(m => `
          <div class="mb-2">
            <strong>@${m.usuario?.username || 'usuario'}</strong>
            <div>${m.texto}</div>
            <div class="small text-muted">${new Date(m.fecha).toLocaleString()}</div>
          </div>
        `).join('');
        box.scrollTop = box.scrollHeight;
      } catch (err) {
        box.innerHTML = '<div class="text-danger">Error cargando mensajes.</div>';
      }
    }

    // Enviar mensaje
    document.addEventListener('DOMContentLoaded', () => {
      // cuando el modal aparece cargamos mensajes
      const chatModalEl = document.getElementById('chatModal');
      chatModalEl.addEventListener('shown.bs.modal', () => {
        if (!token) {
          alert('Debes iniciar sesión para usar el chat.');
          // cerrar modal
          const modal = bootstrap.Modal.getInstance(chatModalEl);
          modal.hide();
          window.location.href = '/pages/login.html';
          return;
        }
        loadChat();
        // actualizar cada 5s mientras está abierto
        window._chatInterval = setInterval(loadChat, 5000);
      });
      chatModalEl.addEventListener('hidden.bs.modal', () => {
        clearInterval(window._chatInterval);
      });

      document.getElementById('chat-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const txt = document.getElementById('chat-input').value.trim();
        if (!txt) return;
        await chatService.sendMessage(token, txt);
        document.getElementById('chat-input').value = '';
        loadChat();
      });
    });

    // inicializar contenidos
    loadRankings();
    loadEventos();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
