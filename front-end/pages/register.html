<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrarse – Robles Gastro Lab</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="navbar-root"></div>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <div class="card p-4 shadow">
          <h2 class="h4 mb-3 text-center">Crear cuenta</h2>

          <form id="register-form">
            <div class="row g-2">
              <div class="col-md-6">
                <label class="form-label">Usuario (username)</label>
                <input name="username" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input name="name" class="form-control" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Correo electrónico</label>
                <input type="email" name="email" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required minlength="6" />
              </div>

              <div class="col-md-6">
                <label class="form-label">Rol</label>
                <select name="role" class="form-select">
                  <option value="user" selected>Usuario</option>
                  <option value="chef">Chef</option>
                </select>
                <div class="form-text">El rol admin se asigna desde el panel de administración.</div>
              </div>

              <div class="col-12 text-center mt-3">
                <button class="btn btn-primary w-100" type="submit">Registrarme</button>
              </div>

              <div class="col-12 text-center mt-2 small">
                ¿Ya tienes cuenta? <a href="/pages/login.html">Inicia sesión</a>
              </div>
            </div>
          </form>

        </div>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script src="/components/navbar.js"></script>
  <script src="/components/footer.js"></script>
  <script src="/services/authService.js"></script>

  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const payload = {
        username: fd.get('username'),
        name: fd.get('name'),
        email: fd.get('email'),
        password: fd.get('password'),
        role: fd.get('role')
      };

      try {
        const res = await authService.register(payload);
        if (res && res.message) {
          alert(res.message || 'Registrado');
          window.location.href = '/pages/login.html';
        } else {
          alert('Error en el registro. Revisa los datos.');
        }
      } catch (err) {
        console.error(err);
        alert('Ocurrió un error al registrar.');
      }
    });
  </script>
</body>
</html>
